name: Source distribution checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm test
      - run: npm run check
      - run: /bin/sh -n install.sh
      - run: npm run bundle
      - run: npm run bundle:extension
      - uses: actions/upload-artifact@v4
        with:
          name: local-codex-source-${{ github.run_id }}
          path: output/releases/
          if-no-files-found: error
