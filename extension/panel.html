<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Codex</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header><div><strong>Local Codex</strong><span id="connection" role="status">Disconnected</span></div><button id="connect">Connect</button></header>
  <section class="settings" aria-label="Workspace and chat">
    <label for="workspace">Workspace for new chats</label>
    <form id="workspaceForm" class="row"><input id="workspace" value="~/.codex/Codex" spellcheck="false" required><button id="applyWorkspace">Apply</button></form>
    <div class="row"><select id="chats" aria-label="Saved chats"><option value="">New conversation</option></select><button id="newChat">New chat</button></div>
    <div id="chatWorkspace" class="path"></div>
  </section>
  <div id="error" role="alert" hidden></div>
  <main id="messages" aria-label="Conversation" aria-live="polite"><div id="empty">No conversation yet.</div></main>
  <footer>
    <section id="attachment" hidden>
      <div class="row"><strong id="pageTitle"></strong><button id="removePage" title="Remove page attachment" aria-label="Remove page attachment">Remove</button></div>
      <div id="pageUrl" class="path"></div>
      <details><summary id="pageSummary">Page preview</summary><pre id="pagePreview"></pre></details>
    </section>
    <div class="row tools"><button id="attachPage">Attach current page</button><label class="toggle"><input id="allowEdits" type="checkbox">Allow workspace edits</label></div>
    <div class="row tools"><label class="toggle"><input id="allowBrowser" type="checkbox">Live browser this turn</label><span id="browserTarget" class="path"></span></div>
    <section id="browserApproval" aria-label="Browser action approval" hidden>
      <strong>Approve browser action?</strong><pre id="browserAction"></pre>
      <div class="row"><button id="denyBrowser" type="button">Deny</button><button id="approveBrowser" type="button">Allow once</button></div>
    </section>
    <form id="sendForm">
      <textarea id="prompt" aria-label="Message to Codex" placeholder="Ask Codex..." rows="3" maxlength="16000" required></textarea>
      <div class="row"><span id="state" role="status">Ready</span><button id="stop" type="button" hidden>Stop</button><button id="send" type="submit" disabled>Send</button></div>
    </form>
  </footer>
  <script type="module" src="panel.js"></script>
</body>
</html>
